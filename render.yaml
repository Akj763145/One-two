# Render Configuration for Movie Wallah
services:
  # Static Site Deployment (Default for frontend-only / SPA on Render)
  - type: web
    name: moviewallah-static
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

